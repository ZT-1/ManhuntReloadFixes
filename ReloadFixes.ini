; ReloadFixes.asi settings. 1 = on, 0 = off. Changes take effect on the next game start.

[Fixes]
; The 6-shooter's reload skips its chamber-flick (cylinder left open) after a partial
; Shotgun_(CT) / Shotgun_Torch_(CT) reload.
RevolverFlick=1

; Pressing reload while a shotgun shot or pump is still playing can end a partial reload
; with an extra pump that ejects a phantom shell.
ShotgunQueuedReload=1

; The sniper rifle never ejects the case from its last shot (the bolt only cycles while rounds
; are left). Ejects it when you reload from an empty magazine.
SniperLastCasing=1

; The pump shotgun's last spent shell comes out on the pump right after the last shot (like
; every other shot), not late in the reload just before the closing pump.
ShotgunLastShell=1

[General]
; 1 = write reloadfixes_asi.log on every start. 0 = only write it when something goes wrong.
Log=1
